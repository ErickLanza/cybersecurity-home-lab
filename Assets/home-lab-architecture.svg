  <!-- Small architecture note -->
  <text x="910" y="730" class="section">LAB FLOW</text>
  <text x="910" y="752" class="desc">Build → Configure →</text>
  <text x="910" y="769" class="desc">Monitor → Detect →</text>
  <text x="910" y="786" class="desc">Assess → Recover</text>
