    <text x="500" y="194" class="desc">Windows Server 2025 Infrastructure</text>
    <text x="500" y="207" class="tag">Open LAB 1 →</text>
  </a>

  <path d="M600 215 L600 235" class="line" marker-end="url(#arrow)"/>

  <a href="../01-Windows-Server-Infrastructure/README.md#lab-2">
    <rect x="475" y="240" width="250" height="70" rx="12" class="node"/>
    <text x="500" y="269" class="lab">LAB 2</text>
    <text x="500" y="289" class="desc">Active Directory Domain Services</text>
    <text x="500" y="302" class="tag">Open LAB 2 →</text>
  </a>

  <path d="M600 310 L600 330" class="line" marker-end="url(#arrow)"/>

  <a href="../01-Windows-Server-Infrastructure/README.md#lab-3">
