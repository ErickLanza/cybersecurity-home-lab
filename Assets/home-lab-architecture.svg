    <text x="95" y="643" class="tag">Open LAB 8 →</text>
  </a>

  <a href="../01-Windows-Server-Infrastructure/README.md#lab-9">
    <rect x="350" y="580" width="250" height="72" rx="12" class="node"/>
    <text x="375" y="610" class="lab">LAB 9</text>
    <text x="375" y="630" class="desc">Security Operations</text>
    <text x="375" y="643" class="tag">Open LAB 9 →</text>
  </a>

  <a href="../01-Windows-Server-Infrastructure/README.md#lab-10">
    <rect x="630" y="580" width="250" height="72" rx="12" class="node"/>
    <text x="655" y="610" class="lab">LAB 10</text>
    <text x="655" y="630" class="desc">Windows Security &amp; Sysmon</text>
    <text x="655" y="643" class="tag">Open LAB 10 →</text>
