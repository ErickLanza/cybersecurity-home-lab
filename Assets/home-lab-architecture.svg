  <rect width="1200" height="900" class="bg"/>
  <rect x="28" y="24" width="1144" height="852" rx="20" class="panel"/>

  <text x="60" y="68" class="title">Cybersecurity Home Lab</text>
  <text x="60" y="94" class="subtitle">Interactive architecture map · LAB 1–14</text>

  <!-- Central progression -->
  <text x="475" y="130" class="section">FOUNDATION &amp; IDENTITY</text>

  <a href="../01-Windows-Server-Infrastructure/README.md#lab-1">
