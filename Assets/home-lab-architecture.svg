  <a href="../01-Windows-Server-Infrastructure/README.md#lab-14">
    <rect x="630" y="715" width="250" height="72" rx="12" class="core"/>
    <text x="655" y="745" class="lab">LAB 14</text>
    <text x="655" y="765" class="desc">Windows Security &amp; Hardening</text>
    <text x="655" y="778" class="tag">Open LAB 14 →</text>
