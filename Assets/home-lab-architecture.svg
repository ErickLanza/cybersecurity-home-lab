  <path d="M475 517 L475 545" class="line"/>
  <path d="M755 517 L755 545 L730 545 L730 570" class="line" marker-end="url(#arrow)"/>
  <path d="M1020 517 L1020 545 L990 545 L990 570" class="line" marker-end="url(#arrow)"/>

