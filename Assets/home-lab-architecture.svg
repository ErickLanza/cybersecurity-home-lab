  <!-- Final stage -->
  <path d="M195 652 L195 680" class="line" marker-end="url(#arrow)"/>
  <path d="M475 652 L475 680" class="line" marker-end="url(#arrow)"/>
  <path d="M755 652 L755 680" class="line" marker-end="url(#arrow)"/>
  <path d="M1020 652 L1020 680" class="line" marker-end="url(#arrow)"/>

  <text x="80" y="700" class="section">ASSESSMENT, VULNERABILITY &amp; RECOVERY</text>

  <a href="../01-Windows-Server-Infrastructure/README.md#lab-12">
    <rect x="70" y="715" width="250" height="72" rx="12" class="node"/>
    <text x="95" y="745" class="lab">LAB 12</text>
