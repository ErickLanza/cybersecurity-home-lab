<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      .bg{fill:#cbd5e1}
      .panel{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}
      .title{font:700 30px Arial,sans-serif;fill:#1f2937}
      .subtitle{font:400 15px Arial,sans-serif;fill:#64748b}
      .section{font:700 12px Arial,sans-serif;letter-spacing:1.4px;fill:#475569}
      .lab{font:700 15px Arial,sans-serif;fill:#1f2937}
      .desc{font:400 12px Arial,sans-serif;fill:#64748b}
      .tag{font:700 11px Arial,sans-serif;fill:#2563eb}
      .node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
      .core{fill:#f8fafc;stroke:#475569;stroke-width:2}
      .line{stroke:#94a3b8;stroke-width:2.2;fill:none}
      .arrow{fill:#94a3b8}
      a:hover .node,a:hover .core{stroke:#2563eb;stroke-width:2.5}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" class="arrow"/>
    </marker>
